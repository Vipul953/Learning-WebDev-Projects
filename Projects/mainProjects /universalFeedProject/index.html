<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Feed</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
        padding: 20px;
      }
      #list-container {
        height: 600px;
        width: 500px;
        overflow: auto;
        position: relative;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .item {
        height: 100px;
        padding: 12px;
        box-sizing: border-box;
        position: absolute;
        width: 100%;
        background: #fff;
        border-bottom: 1px solid #eee;
        display: flex;
        gap: 12px;
        align-items: center;
        transition: background 0.2s;
      }
      .item:hover {
        background: #f9f9f9;
      }
      .item-image {
        width: 70px;
        height: 70px;
        object-fit: cover;
        border-radius: 4px;
        flex-shrink: 0;
      }
      .item-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }
      .item-title {
        font-weight: 600;
        color: #222;
        font-size: 14px;
        line-height: 1.3;
      }
      .item-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 6px;
        font-size: 12px;
      }
      .item-price {
        font-weight: 600;
        color: #e74c3c;
      }
      .item-rating {
        color: #f39c12;
      }
      .item-category {
        color: #7f8c8d;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="list-container">
      <div id="spacer"></div>
    </div>
    <div id="sentinel"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
